<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계관 노트 · 끝에 도달하는 이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="head">
    <a class="back" href="../mock/">← 화면 시안</a>
    <h1>세계관 노트</h1>
    <p>핵심에 첨언을 덧붙여 정리한 곳이에요. 맨 위의 <b>큰 분류</b>(세계관 · 제국 · 직업 · 변이 · 던전 · 도구 · 전체적인 삶 · 아이디어 노트)를 고르고, 왼쪽 <b>목차</b>와 위 <b>경로</b>로 층을 따라가면 고른 것만 나와요. 줄을 누르면 열리고, 긴 글은 <b>페이지로 열기</b>로 한 페이지에서 볼 수 있어요.</p>
  </header>
  <div class="legend">
    <div><span class="tag k">핵심</span> 사용자가 정해 준 것 · 바꾸지 않아요</div>
    <div><span class="tag w">첨언</span> Claude가 덧붙인 아이디어 초안 · 마음에 안 들면 바꿔요</div>
    <div><span class="tag">열린 질문</span> 정해야 할 것</div>
  </div>

  <div class="top">
    <button class="chip" id="tocBtn" aria-expanded="false" aria-controls="toc">☰ 목차</button>
    <nav class="crumb" id="crumb" aria-label="경로"></nav>
    <button class="chip" id="askBtn" aria-pressed="false">열린 질문 있는 것만</button>
    <button class="chip" id="editBtn" aria-pressed="false">✎ 편집 모드</button>
  </div>
  <div id="ehost"></div>
  <input class="search" type="search" id="q" placeholder="검색 (예: 허기, 심장, 몬스터, 제국)" autocomplete="off">

  <div class="shell">
    <nav class="toc" id="toc" aria-label="목차"></nav>
    <div class="main">
      <div id="list" class="main"></div>
      <div class="empty" id="empty" hidden>해당하는 항목이 없습니다.</div>
      <p class="note" id="foot"></p>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="render.js"></script>
<script src="edit.js"></script>
<script>
const { esc, GROUPS, TYPES, ENTRIES, ALL, byId, eById, tById, gById, SECTIONS, secById, secOfGroup, secOfType, childrenOf, isPlace, pathSel, noteBlocks, entryBlocks, statusOf, searchText, W } = WN;
const $ = id => document.getElementById(id);
let sel = '', q = '', onlyAsk = false;
const hasAsk = x => !!(x.ask && x.ask.length);
const openKeys = new Set();

// ---------- 목차 트리 ----------
function entNode(e) { return { key: e.id, label: e.name, sel: e.id, kids: childrenOf(e).map(entNode) }; }
function groupNode(g) { return { key: 'g=' + g.id, label: g.name, sel: 'g=' + g.id, ct: g.items.length, kids: g.items.map(i => ({ key: i.id, label: i.title, sel: i.id })) }; }
function typeNode(ty) { const list = ENTRIES.filter(e => e.type === ty.id); return { key: 't=' + ty.id, label: ty.name, sel: 't=' + ty.id, ct: list.length, kids: list.map(e => ({ key: e.id, label: e.name, sel: e.id })) }; }
function sectionKids(sc) {
  const kids = (sc.groups || []).map(id => gById[id]).filter(Boolean).map(groupNode);
  const places = ENTRIES.filter(e => isPlace(e) && !e.parent && (sc.types || []).includes(e.type));
  places.forEach(e => kids.push(entNode(e)));                       // 장소는 제국 > 도시 > 마을 계층 그대로
  (sc.types || []).filter(id => tById[id] && !WN.placeTypes.has(id)).forEach(id => { if (ENTRIES.some(e => e.type === id)) kids.push(typeNode(tById[id])); });
  return kids;
}
function sectionCount(sc) { return (sc.groups || []).reduce((n, id) => n + (gById[id] ? gById[id].items.length : 0), 0) + ENTRIES.filter(e => (sc.types || []).includes(e.type)).length; }
function tree() { return SECTIONS.map(sc => ({ key: 's=' + sc.id, label: sc.name, sel: 's=' + sc.id, ct: sectionCount(sc), kids: sectionKids(sc) })); }
function onPath(nodes, target, acc = []) { // 선택된 항목까지의 가지 key 목록
  for (const n of nodes) {
    if (n.sel === target) return [...acc, n.key];
    const r = onPath(n.kids || [], target, [...acc, n.key]); if (r) return r;
  }
  return null;
}
function btn(cls, text, fn) { const b = document.createElement('button'); b.className = cls; b.type = 'button'; b.textContent = text; b.onclick = fn; return b; }
function nodeEl(n, path) {
  const li = document.createElement('li'), row = document.createElement('div'); row.className = 'row';
  const isCur = n.sel === sel, kids = n.kids && n.kids.length;
  const open = path.includes(n.key) || openKeys.has(n.key);
  if (kids) {
    const f = btn('fold', open ? '▾' : '▸', () => { open ? openKeys.delete(n.key) : openKeys.add(n.key); renderToc(); });
    f.setAttribute('aria-label', n.label + (open ? ' 접기' : ' 펼치기')); row.append(f); li.className = 'grp';
  } else { const sp = document.createElement('span'); sp.style.cssText = 'width:22px;flex:none'; row.append(sp); }
  const t = btn('t', n.label, () => go(n.sel)); if (isCur) t.setAttribute('aria-current', 'page');
  row.append(t);
  if (n.ct) { const c = document.createElement('span'); c.className = 'ct'; c.textContent = n.ct; row.append(c); }
  li.append(row);
  if (kids && open) { const ul = document.createElement('ul'); n.kids.forEach(k => ul.append(nodeEl(k, path))); li.append(ul); }
  return li;
}
function renderToc() {
  const nodes = tree(), path = onPath(nodes, sel) || [], ul = document.createElement('ul');
  nodes.forEach(n => ul.append(nodeEl(n, path)));
  $('toc').textContent = ''; $('toc').append(ul);
}
function renderCrumb() {
  const p = pathSel(sel), c = $('crumb'); c.textContent = '';
  p.forEach((x, i) => {
    if (i) { const s = document.createElement('i'); s.textContent = '›'; c.append(s); }
    if (i === p.length - 1) { const b = document.createElement('b'); b.textContent = x.label; c.append(b); }
    else c.append(btn('', x.label, () => go(x.sel)));
  });
}

// ---------- 본문 ----------
const refBtn = (id, text) => `<button class="ref" data-sel="${id}">${esc(text)}</button>`;
const pageLink = id => `<a class="pg" href="page.html#${id}" onclick="event.stopPropagation()">페이지로 열기 ↗</a>`;
function lineHTML(i, open) {
  const [st, cls] = statusOf(i);
  return `<details class="line" id="i-${i.id}" data-id="${i.id}"${open ? ' open' : ''}><summary><span class="ttl">${esc(i.title)}<small>핵심 ${i.core.length} · 첨언 ${i.add.length}${hasAsk(i) ? ' · 질문 ' + i.ask.length : ''}</small></span><span class="tag ${cls}">${st}</span>${WN.isChanged(i.id) ? '<span class="tag w">수정됨</span>' : ''}${pageLink(i.id)}</summary><div class="body">${noteBlocks(i, refBtn)}</div></details>`;
}
function entryHTML(e, open) {
  const t = tById[e.type], anc = WN.ancestors(e), kids = childrenOf(e), [st, cls] = statusOf(e);
  return `<details class="line" id="i-${e.id}" data-id="${e.id}"${open ? ' open' : ''}><summary><span class="ttl">${esc(e.name)}<small>${esc(t.name)}${anc.length ? ' · ' + anc.map(a => esc(a.name)).join(' > ') : ''}${hasAsk(e) ? ' · 질문 ' + e.ask.length : ''}${kids.length ? ' · 하위 ' + kids.length : ''}</small></span><span class="tag ${cls}">${st}</span>${WN.isChanged(e.id) ? '<span class="tag w">수정됨</span>' : ''}${pageLink(e.id)}</summary><div class="body">${entryBlocks(e, refBtn)}</div></details>`;
}
const card = (s, title, small) => `<button class="cardb" data-sel="${s}"><b>${esc(title)}</b><small>${esc(small)}</small></button>`;
const section = (title, count, inner) => `<section class="grp"><h2><span>${esc(title)}</span><small>${count}</small></h2>${inner}</section>`;
const filt = l => onlyAsk ? l.filter(hasAsk) : l;

function view() { // [html, 개수, 열린 항목 id]
  const k = q.trim().toLowerCase();
  if (k) {
    const a = filt(ALL).filter(i => searchText(i).includes(k)), b = filt(ENTRIES).filter(e => searchText(e).includes(k));
    return [(a.length ? section('주제 노트', a.length, a.map(i => lineHTML(i)).join('')) : '') + (b.length ? section('사전', b.length, b.map(e => entryHTML(e)).join('')) : ''), a.length + b.length];
  }
  if (!sel) return [`<div class="cards">${SECTIONS.map(sc => card('s=' + sc.id, sc.name, `${sc.desc || ''} · ${sectionCount(sc)}개`)).join('')}</div>`, SECTIONS.length];
  if (sel.startsWith('s=')) {
    const sc = secById[sel.slice(2)]; if (!sc) return ['', 0];
    const cards = [];
    (sc.groups || []).map(id => gById[id]).filter(Boolean).forEach(g => cards.push(card('g=' + g.id, g.name, `주제 노트 ${g.items.length}줄`)));
    (sc.types || []).filter(id => tById[id] && !WN.placeTypes.has(id)).forEach(id => { const n = ENTRIES.filter(e => e.type === id).length; if (n) cards.push(card('t=' + id, tById[id].name, `사전 ${n}개`)); });
    const places = filt(ENTRIES.filter(e => isPlace(e) && !e.parent && (sc.types || []).includes(e.type)));
    const html = `<p class="note">${esc(sc.desc || '')}</p>${cards.length ? `<div class="cards">${cards.join('')}</div>` : ''}${places.length ? section('장소 (제국 › 국가 › 도시 › 마을)', places.length, places.map(e => entryHTML(e)).join('')) : ''}`;
    return [html, cards.length + places.length];
  }
  if (sel.startsWith('g=')) { const g = gById[sel.slice(2)]; if (!g) return ['', 0]; const l = filt(ALL.filter(i => i.group === g.id)); return [section(g.name, l.length, l.map(i => lineHTML(i)).join('')), l.length]; }
  if (sel.startsWith('t=')) { const l = filt(ENTRIES.filter(e => e.type === sel.slice(2))); return [l.map(e => entryHTML(e)).join(''), l.length]; }
  if (byId[sel]) { const i = byId[sel], l = filt(ALL.filter(x => x.group === i.group)); const list = l.includes(i) ? l : [i, ...l]; return [section(i.gname, list.length, list.map(x => lineHTML(x, x.id === sel)).join('')), list.length, sel]; }
  if (eById[sel]) {
    const e = eById[sel], kids = filt(childrenOf(e));
    return [entryHTML(e, true) + (kids.length ? section('하위 항목', kids.length, kids.map(x => entryHTML(x)).join('')) : ''), 1 + kids.length, sel];
  }
  return ['', 0];
}
function render() {
  renderToc(); renderCrumb();
  const [html, n, openId] = view();
  $('list').innerHTML = html; $('empty').hidden = n > 0;
  if (WEdit.isOn()) document.querySelectorAll('#list details.line').forEach(d => { const x = WN.objOf(d.dataset.id), body = d.querySelector('.body'); if (x && body) { body.textContent = ''; body.append(WEdit.editorFor(x)); } });
  $('editBtn').setAttribute('aria-pressed', WEdit.isOn()); WEdit.refresh();
  $('askBtn').setAttribute('aria-pressed', onlyAsk);
  $('foot').textContent = `큰 분류 ${SECTIONS.length}개 · 주제 노트 ${ALL.length}줄 · 사전 ${ENTRIES.length}개 · 마지막 정리 ${W.updated}`;
  if (openId) { const d = document.getElementById('i-' + openId); if (d && d.scrollIntoView) d.scrollIntoView({ block: 'start' }); }
}
function valid(s) { return !s || (s.startsWith('s=') && secById[s.slice(2)]) || (s.startsWith('g=') && gById[s.slice(2)]) || (s.startsWith('t=') && tById[s.slice(2)]) || byId[s] || eById[s]; }
function go(s) {
  sel = valid(s) ? s : ''; q = ''; $('q').value = ''; openKeys.clear();
  $('toc').classList.remove('open'); $('tocBtn').setAttribute('aria-expanded', 'false');
  try { history.replaceState(null, '', sel ? '#' + sel : location.pathname + location.search); } catch (e) {}
  render(); if (!document.querySelector('details[open]')) window.scrollTo({ top: 0 });
}
$('list').addEventListener('click', e => { const r = e.target.closest('[data-sel]'); if (r) { e.preventDefault(); go(r.dataset.sel); } });
$('q').addEventListener('input', e => { q = e.target.value; render(); });
$('askBtn').onclick = () => { onlyAsk = !onlyAsk; render(); };
$('editBtn').onclick = () => { WEdit.set(!WEdit.isOn()); render(); };
WEdit.mount($('ehost'), render);
$('tocBtn').onclick = () => { const o = $('toc').classList.toggle('open'); $('tocBtn').setAttribute('aria-expanded', o); };
window.addEventListener('hashchange', () => { const s = decodeURIComponent(location.hash.slice(1)); if (valid(s) && s !== sel) { sel = s; q = ''; $('q').value = ''; render(); } });
sel = valid(decodeURIComponent(location.hash.slice(1))) ? decodeURIComponent(location.hash.slice(1)) : '';
render();
</script>
</body>
</html>
